name: BERTopic lightweight wheel verification
on:
  push:
    branches: [gelistirme-2.5-staging]
    paths:
      - "turkmetinlab/tools/prepare_bertopic_wheel.py"
      - ".github/workflows/bertopic-hafif-paket.yml"
jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Official wheel
        run: python -m pip download --no-deps --only-binary=:all: bertopic==0.17.4 -d /tmp/bertopic_upstream
      - name: Verify and create lightweight wheel
        run: |
          python turkmetinlab/tools/prepare_bertopic_wheel.py \
            /tmp/bertopic_upstream/bertopic-0.17.4-py3-none-any.whl \
            /tmp/bertopic-0.17.4-py3-none-any.whl
      - name: Export audited wheel content
        run: |
          python - <<'PY'
          import base64
          with open("/tmp/bertopic-0.17.4-py3-none-any.whl", "rb") as f:
              data=base64.b64encode(f.read()).decode("ascii")
          for i in range(0,len(data),6000):
              print("TML_BLOB64_"+str(i//6000)+"="+data[i:i+6000])
          PY
