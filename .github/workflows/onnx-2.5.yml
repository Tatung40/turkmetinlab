# TürkMetinLab 2.5 — E5-small ONNX karşılaştırması (yalnızca CPU).
# YALNIZCA elle başlatılır. Uygulamayı, varsayılan testleri ve Streamlit'i değiştirmez.
# Tek iş = tek makine: TF-IDF, E5 PyTorch ve E5 ONNX aynı donanımda ölçülür.
# Sıra: dönüştür → 20 örnekte uyum → kip'e göre:
#   staging (varsayılan): uygulama entegrasyon testi (gerçek model, 100/500 belge, AppTest) → isteğe bağlı Hugging Face
#                         yayını (yalnızca HF_TOKEN gizli anahtarı ve TML_HF_REPO değişkeni tanımlıysa).
#   karsilastirma: fizibilite karşılaştırması (100 → başarılıysa 500 belge).
#   uzman: 50 sorguluk kör uzman değerlendirme havuzu. Metin içeren dosyalar yalnızca TML_DOGRULAMA_PAROLA ile
#          şifrelenmiş 7z olarak saklanır; şifresiz yüklenmez.
#   egitim: Eğitim Programları ve Öğretim derlemi (OpenAlex) + üç insan uzmanlı kör havuz. Veri yetersizse (çıkış 3)
#           uzman dosyası üretilmez. Aynı şifreli paketleme kuralları geçerlidir.
# Yeniden deneme yoktur.
name: ONNX 2.5 (E5-small)

on:
  workflow_dispatch:
    inputs:
      kip:
        description: "staging: uygulama entegrasyon testi · karsilastirma: fizibilite ölçümü · uzman: DergiPark havuzu · egitim: Eğitim Programları ve Öğretim insan doğrulaması"
        type: choice
        options: [staging, karsilastirma, uzman, egitim]
        default: staging
      asama:
        description: "Yalnızca kip=uzman/egitim — pilot: 5 sorgu (önce bu) · asil: 50 sorgu"
        type: choice
        options: [pilot, asil]
        default: pilot

permissions:
  contents: read

concurrency:
  group: onnx-2-5
  cancel-in-progress: false

jobs:
  onnx:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıklar (PyTorch CPU dizini; dönüştürme ve PyTorch referansı için)
        timeout-minutes: 15
        run: |
          mkdir -p cikti
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r fizibilite_2.5/requirements-fizibilite.txt -r fizibilite_2.5/onnx/requirements-donusturme.txt
          python fizibilite_2.5/ortam_denetimi.py cikti

      - name: torch'suz çıkarım ortamı (ONNX ölçümleri burada çalışır)
        timeout-minutes: 10
        run: |
          python -m venv "$RUNNER_TEMP/ortvenv"
          "$RUNNER_TEMP/ortvenv/bin/pip" install -r fizibilite_2.5/onnx/requirements-onnx.txt
          "$RUNNER_TEMP/ortvenv/bin/pip" freeze > cikti/onnx_ortam_paketleri.txt
          if grep -qi '^torch' cikti/onnx_ortam_paketleri.txt; then echo "HATA: çıkarım ortamında torch var"; exit 1; fi

      - name: Değerlendirme verisi (DergiPark; yalnızca bu iş süresince)
        timeout-minutes: 5
        run: |
          curl -fsSL --retry 2 --max-time 120 -o "$RUNNER_TEMP/TRAll.txt" \
            https://raw.githubusercontent.com/humakilicunlu/DergiParkEn/main/TRAll.txt
          sha256sum "$RUNNER_TEMP/TRAll.txt" | tee cikti/veri_sha256.txt

      - name: Model önbelleği (ağırlıklar artifact'e girmez)
        uses: actions/cache@v4
        with:
          path: ~/.cache/turkmetinlab_modeller
          key: modeller-e5-v1
          restore-keys: modeller-

      - name: E5'i indir (tek deneme)
        timeout-minutes: 15
        run: python fizibilite_2.5/model_indir.py ~/.cache/turkmetinlab_modeller cikti intfloat/multilingual-e5-small

      - name: ONNX önbelleği (dönüşüm bir kez yapılır)
        id: onnx_onbellek
        uses: actions/cache@v4
        with:
          path: ~/.cache/turkmetinlab_onnx/e5
          key: onnx-e5-${{ hashFiles('fizibilite_2.5/onnx/e5_onnx_donustur.py', 'fizibilite_2.5/onnx/requirements-donusturme.txt') }}

      - name: ONNX'e dönüştür (önbellek doğrulanır; eksik/uyumsuzsa yeniden oluşturulur)
        timeout-minutes: 15
        run: >
          python fizibilite_2.5/onnx/e5_onnx_donustur.py --onbellekten-devam
          --onbellek ~/.cache/turkmetinlab_modeller --cikti ~/.cache/turkmetinlab_onnx/e5 --kunye cikti/onnx_kunye.json

      - name: Uyum denetimi — 20 örnek (FP32 uyumsuzsa iş durur; INT8 hatası yalnızca INT8'i eler)
        timeout-minutes: 10
        run: |
          python fizibilite_2.5/onnx/e5_onnx_uyum.py --onnx-klasor ~/.cache/turkmetinlab_onnx/e5 \
            --onbellek ~/.cache/turkmetinlab_modeller --veri "$RUNNER_TEMP/TRAll.txt" \
            --cikti cikti --adaylar cikti/onnx_adaylar.txt
          echo "ADAYLAR=$(cat cikti/onnx_adaylar.txt)" >> "$GITHUB_ENV"

      - name: Aşama 1 — 100 belge
        if: inputs.kip == 'karsilastirma'
        timeout-minutes: 25
        run: >
          python fizibilite_2.5/anlamsal_karsilastirma.py --kati --n 100 --etiket onnx
          --yontemler "tfidf_tml,e5_ozgun,$ADAYLAR"
          --onnx-klasor ~/.cache/turkmetinlab_onnx/e5 --onnx-python "$RUNNER_TEMP/ortvenv/bin/python"
          --veri "$RUNNER_TEMP/TRAll.txt" --onbellek ~/.cache/turkmetinlab_modeller --cikti cikti
          --azami-sure 900 --azami-rss-mb 6000

      - name: Aşama 2 — 500 belge (yalnızca aşama 1 başarılıysa)
        if: inputs.kip == 'karsilastirma'
        timeout-minutes: 35
        run: >
          python fizibilite_2.5/anlamsal_karsilastirma.py --kati --n 500 --etiket onnx
          --yontemler "tfidf_tml,e5_ozgun,$ADAYLAR"
          --onnx-klasor ~/.cache/turkmetinlab_onnx/e5 --onnx-python "$RUNNER_TEMP/ortvenv/bin/python"
          --veri "$RUNNER_TEMP/TRAll.txt" --onbellek ~/.cache/turkmetinlab_modeller --cikti cikti
          --azami-sure 1500 --azami-rss-mb 6000

      - name: Staging — uygulama entegrasyon testi (gerçek E5 ONNX FP32; 20 / 100 / 500 belge; AppTest)
        if: inputs.kip != 'karsilastirma' && inputs.kip != 'uzman' && inputs.kip != 'egitim'
        timeout-minutes: 45
        run: |
          APP=.; [ -f turkmetinlab/app.py ] && APP=turkmetinlab
          python -m venv "$RUNNER_TEMP/appvenv"
          "$RUNNER_TEMP/appvenv/bin/pip" install -r "$APP/staging/requirements.txt"
          "$RUNNER_TEMP/appvenv/bin/python" "$APP/staging/entegrasyon_testi.py" --onnx-klasor ~/.cache/turkmetinlab_onnx/e5 \
            --veri "$RUNNER_TEMP/TRAll.txt" --fizibilite fizibilite_2.5 --cikti cikti

      - name: Staging — modeli Hugging Face'e yayınla (isteğe bağlı; yalnızca testler geçtiyse)
        if: inputs.kip != 'karsilastirma' && inputs.kip != 'uzman' && inputs.kip != 'egitim'
        timeout-minutes: 15
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ vars.TML_HF_REPO }}
          HF_GIZLI: ${{ vars.TML_HF_GIZLI }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_REPO" ]; then
            echo "HF_TOKEN gizli anahtarı ya da TML_HF_REPO değişkeni yok; yayın atlandı."; exit 0
          fi
          python fizibilite_2.5/onnx/hf_yayinla.py --onnx-klasor ~/.cache/turkmetinlab_onnx/e5 --repo "$HF_REPO" \
            --gizli "${HF_GIZLI:-false}" --cikti cikti/hf_yayin.json

      - name: Uzman doğrulama havuzu (yalnızca kip=uzman; yalnızca şifreli paket yüklenir)
        if: inputs.kip == 'uzman'
        timeout-minutes: 30
        env:
          PAROLA: ${{ secrets.TML_DOGRULAMA_PAROLA }}
          ASAMA: ${{ inputs.asama }}
        run: |
          set -euo pipefail  # set -x YOK: parola komut satırında görünmesin (gizli anahtarlar ayrıca maskelenir)
          case "${ASAMA:-pilot}" in pilot|asil) ASAMA="${ASAMA:-pilot}" ;; *) echo "::error::geçersiz aşama"; exit 1 ;; esac
          if [ -z "${PAROLA:-}" ]; then
            echo "::error::TML_DOGRULAMA_PAROLA gizli anahtarı yok. Metin içeren dosyalar şifresiz yüklenmez."; exit 1
          fi
          if ! command -v 7z > /dev/null; then  # Ubuntu deposundan ücretsiz p7zip-full (tek deneme)
            sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full > /dev/null || true
          fi
          command -v 7z > /dev/null || { echo "::error::7z kurulamadı; paket üretilmedi."; exit 1; }
          GIZLI="$RUNNER_TEMP/uzman_gizli"
          PAKET="$GITHUB_WORKSPACE/cikti/uzman_paketi_${ASAMA}.7z"
          trap 'rm -rf "$GIZLI"' EXIT  # şifresiz dosyalar her durumda silinir; artifact klasörüne hiç yazılmaz
          APP=.; [ -f turkmetinlab/app.py ] && APP=turkmetinlab
          python -m venv "$RUNNER_TEMP/uzvenv"
          "$RUNNER_TEMP/uzvenv/bin/pip" install -q -r "$APP/staging/requirements.txt"
          "$RUNNER_TEMP/uzvenv/bin/python" "$APP/uzman_dogrulama/havuz_olustur.py" --asama "$ASAMA" \
            --onnx-klasor ~/.cache/turkmetinlab_onnx/e5 --veri "$RUNNER_TEMP/TRAll.txt" --fizibilite fizibilite_2.5 \
            --cikti "$GIZLI" --ozet cikti
          cp "$APP/uzman_dogrulama/YONERGE.md" "$GIZLI/uzmanlara_gonderin/"
          bash "$APP/uzman_dogrulama/paketle.sh" "$GIZLI" "$PAKET"
          if [ -n "$(find cikti \( -name '*.xlsx' -o -name '*anahtar*.json' \) -print)" ]; then
            rm -f "$PAKET"; echo "::error::Artifact klasöründe şifresiz uzman dosyası bulundu; yükleme durduruldu."; exit 1
          fi

      - name: Eğitim insan doğrulaması (yalnızca kip=egitim; yalnızca şifreli paket yüklenir)
        if: inputs.kip == 'egitim'
        timeout-minutes: 40
        env:
          PAROLA: ${{ secrets.TML_DOGRULAMA_PAROLA }}
          ASAMA: ${{ inputs.asama }}
        run: |
          set -euo pipefail  # set -x YOK: parola günlüğe yazılmaz
          case "${ASAMA:-pilot}" in pilot) ASAMA=egitim_pilot ;; asil) ASAMA=egitim_asil ;; *) echo "::error::geçersiz aşama"; exit 1 ;; esac
          if [ -z "${PAROLA:-}" ]; then
            echo "::error::TML_DOGRULAMA_PAROLA gizli anahtarı yok. Metin içeren dosyalar şifresiz yüklenmez."; exit 1
          fi
          if ! command -v 7z > /dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full > /dev/null || true
          fi
          command -v 7z > /dev/null || { echo "::error::7z kurulamadı; paket üretilmedi."; exit 1; }
          GIZLI="$RUNNER_TEMP/egitim_gizli"
          PAKET="$GITHUB_WORKSPACE/cikti/egitim_insan_paketi_${ASAMA}.7z"
          trap 'rm -rf "$GIZLI"' EXIT
          APP=.; [ -f turkmetinlab/app.py ] && APP=turkmetinlab
          python -m venv "$RUNNER_TEMP/egvenv"
          "$RUNNER_TEMP/egvenv/bin/pip" install -q -r "$APP/staging/requirements.txt"
          PY="$RUNNER_TEMP/egvenv/bin/python"
          "$PY" "$APP/uzman_dogrulama/egitim_derlem.py" --cikti "$GIZLI/yalnizca_arastirmaci/egitim_derlem.jsonl" --ozet cikti
          PILOT_OZETI=()
          [ "$ASAMA" = egitim_asil ] && [ -f "$APP/uzman_dogrulama/egitim_havuz_ozeti_egitim_pilot.json" ] && \
            PILOT_OZETI=(--pilot-ozeti "$APP/uzman_dogrulama/egitim_havuz_ozeti_egitim_pilot.json")
          set +e
          "$PY" "$APP/uzman_dogrulama/egitim_havuz.py" --asama "$ASAMA" --derlem "$GIZLI/yalnizca_arastirmaci/egitim_derlem.jsonl" \
            --onnx-klasor ~/.cache/turkmetinlab_onnx/e5 --cikti "$GIZLI" --ozet cikti "${PILOT_OZETI[@]}"
          KOD=$?
          set -e
          if [ "$KOD" -eq 3 ]; then
            echo "::error::VERİ YETERSİZ: uzman dosyaları üretilmedi (ayrıntı: egitim_derlem_ozeti.json, egitim_havuz_ozeti_*.json)."; exit 3
          fi
          [ "$KOD" -eq 0 ] || exit "$KOD"
          cp "$APP/uzman_dogrulama/YONERGE_EGITIM.md" "$GIZLI/uzmanlara_gonderin/"
          bash "$APP/uzman_dogrulama/paketle.sh" "$GIZLI" "$PAKET"
          if [ -n "$(find cikti \( -name '*.xlsx' -o -name '*anahtar*.json' -o -name '*.jsonl' \) -print)" ]; then
            rm -f "$PAKET"; echo "::error::Artifact klasöründe şifresiz dosya bulundu; yükleme durduruldu."; exit 1
          fi

      - name: Özet
        if: always()
        run: |
          echo "Ölçüm makinesi: GitHub Actions ubuntu-latest (CPU). Streamlit sunucu ölçümü değildir." >> "$GITHUB_STEP_SUMMARY"
          for f in cikti/onnx_uyum_20.json; do [ -f "$f" ] && { echo '```json'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; done
          for f in cikti/sonuclar_n100_onnx.md cikti/sonuclar_n500_onnx.md cikti/staging_entegrasyon.md; do [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY"; done
          ls -la cikti || true

      - name: Sonuçları sakla (yalnızca JSON, Markdown, TXT; ONNX dosyaları girmez)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onnx-2.5-sonuclar
          path: |
            cikti/*.json
            cikti/*.md
            cikti/*.txt
            cikti/*.7z
          if-no-files-found: warn
          retention-days: 30